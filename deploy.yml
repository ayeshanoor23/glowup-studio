
name: Task Manager CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-project:
    name: Check Project Files and Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All project files are present."

      - name: Verify repository secrets
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DEPLOYMENT_ENV: ${{ secrets.DEPLOYMENT_ENV }}
        run: |
          test -n "$PROJECT_NAME"
          test -n "$DEPLOYMENT_ENV"
          echo "Required secrets are configured."

  deploy:
    name: Deploy to GitHub Pages
    needs: check-project
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
